name: Plugin eval

# Runs the evals/plugin or the evals/outcome suite against the plugin in this checkout. Every
# case is a real agent run on a paid API key, so this workflow never runs on push or on a
# schedule. Run it before every tag and after any change to a default model (docs/releasing.md),
# and record the result in research/ with the exact model IDs printed in the job summary.
#
# The key lives in the `plugin-eval` environment, not in repository secrets, so that a required
# reviewer on that environment can gate every run.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "plugin: does the skill load and cite its verifier. outcome: does it change the work"
        required: true
        default: plugin
        type: choice
        options: [plugin, outcome]
      model:
        description: Agent model ID
        required: true
        default: claude-opus-5-5
      judge-model:
        description: Judge model ID for the LLM graders
        required: true
        default: claude-haiku-5-5

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    name: claude plugin eval
    # The Linux client can start but then reject every shell call in apply-seccomp.
    # Use the native macOS sandbox for outcome tasks; keep sandbox policy unchanged.
    runs-on: ${{ inputs.suite == 'outcome' && 'macos-26' || 'ubuntu-latest' }}
    # 54 agent runs for the outcome suite (9 cases, 3 runs, 2 arms), four at a time: fourteen
    # batches of at most 15 minutes, plus the judge, the scaffolds, and the toolchain install.
    timeout-minutes: ${{ inputs.suite == 'outcome' && 270 || 60 }}
    environment: plugin-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git credentials; gh reads GH_TOKEN from the step env.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check the inputs and the key
        env:
          MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge-model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          for id in "$MODEL" "$JUDGE_MODEL"; do
            if ! printf '%s' "$id" | grep -Eqx 'claude-[a-z0-9-]+'; then
              echo "::error::not a model ID: ${id}"
              exit 1
            fi
          done
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::the plugin-eval environment has no ANTHROPIC_API_KEY secret; nothing ran"
            exit 1
          fi

      # The suite format needs Claude Code 2.1.269 or later. The pin is CLAUDE_CODE_VERSION in
      # checks/check.sh, the same client the plugin install gate uses, so a release cannot change
      # a result between two runs on the same commit.
      - name: Install the pinned CLI
        run: |
          set -euo pipefail
          version="$(grep '^CLAUDE_CODE_VERSION=' checks/check.sh | cut -d'"' -f2)"
          npm install --global "@anthropic-ai/claude-code@${version}"
          echo "CLAUDE_CODE_VERSION=${version}" >> "$GITHUB_ENV"

      # `claude plugin eval .` loads a plugin only from a manifest at the target. The repository has
      # none, because Codex installs no bundle while a root manifest names another plugin
      # (docs/releasing.md). Without it the CLI runs one arm with no plugin and still reports a
      # score. This checkout is discarded after the job, so the manifest never reaches a branch.
      - name: Write the plugin manifest for the evaluation
        run: |
          set -euo pipefail
          mkdir -p .claude-plugin
          printf '%s\n' '{"name": "rust-skills", "description": "rust-skills catalog for the plugin evaluation", "skills": ["./skills"]}' \
            > .claude-plugin/plugin.json

      # The outcome cases build std-only crates offline. The runner's rustup installs the
      # toolchain that checks/rust-toolchain.toml pins, the same one the offline gate uses.
      - name: Install the pinned toolchain for the outcome suite
        if: inputs.suite == 'outcome'
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' checks/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          # The client seals HOME and drops Rust environment overrides. Keep the pin
          # and offline policy in operator-owned launchers that its PATH can reach.
          eval_tools="$RUNNER_TEMP/eval-rust-tools"
          mkdir -p "$eval_tools"
          for tool in cargo rustc rustdoc; do
            binary="$(rustup which "$tool" --toolchain "$channel")"
            printf '#!/bin/sh\nexport CARGO_NET_OFFLINE=true\nexec "%s" "$@"\n' "$binary" > "$eval_tools/$tool"
            chmod +x "$eval_tools/$tool"
          done
          echo "$eval_tools" >> "$GITHUB_PATH"
          cargo --version

      - name: Run the plugin suite
        if: inputs.suite == 'plugin'
        env:
          MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge-model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          claude plugin eval . \
            --eval-dir evals/plugin \
            --trust-plugin \
            --model "$MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --max-cost-usd 20 \
            --threshold 0.8 \
            --no-publish \
            --json eval-results.json

      - name: Check shell execution before the outcome suite
        if: inputs.suite == 'outcome'
        env:
          CARGO_NET_OFFLINE: "true"
          MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          claude plugin eval . \
            --eval-dir checks/sandbox-eval \
            --trust-plugin --ablation none --allow-tools Bash \
            --model "$MODEL" --threshold 1 --max-cost-usd 1 \
            --no-publish --json sandbox-results.json

      # A measurement, not a gate: no --threshold. --scaffold runs the case scripts from this
      # checkout, and --allow-tools lets the agent run cargo and edit its workspace.
      # A failed grader is a result to record. Summarize fails on execution errors or missing measurements.
      - name: Run the outcome suite
        if: inputs.suite == 'outcome'
        continue-on-error: true
        env:
          CARGO_NET_OFFLINE: "true"
          MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge-model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          claude plugin eval . \
            --eval-dir evals/outcome \
            --trust-plugin \
            --scaffold \
            --allow-tools Bash Write Edit \
            --concurrency 4 \
            --model "$MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --max-cost-usd 40 \
            --no-publish \
            --json eval-results.json

      - name: Summarize
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
          MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge-model }}
        run: |
          set -euo pipefail
          cat eval-results.json 2>/dev/null || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, math, os, subprocess
          commit = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
          print(f"Suite `{os.environ['SUITE']}`, catalog `{commit}`, CLI `{os.environ.get('CLAUDE_CODE_VERSION', 'not installed')}`, agent `{os.environ['MODEL']}`, judge `{os.environ['JUDGE_MODEL']}`\n")
          try:
              data = json.load(open("eval-results.json"))
          except (OSError, ValueError):
              print("No result file: the run failed before it wrote one.")
              raise SystemExit(1)
          cases = data.get("cases", [])
          runs = [run for case in cases for arm in ("with", "without")
                  for run in case.get("arms", {}).get(arm, [])]
          errors = [run["error"] for run in runs if run.get("error")]
          sandbox_failures = ("apply-seccomp: write /proc/self/",
                              "sandbox is enabled but dependencies are missing")
          errors.extend("shell sandbox failed inside the agent trace" for run in runs
                        if any(marker in grader.get("evidence", "")
                               for grader in run.get("graders", []) for marker in sandbox_failures))
          if errors:
              print(f"Execution errors: {len(errors)} run(s) did not complete. First error: {errors[0]}")
              raise SystemExit(1)
          scores = [run.get("score") for run in runs]
          if not scores or any(type(score) not in (int, float) or not math.isfinite(score)
                               for score in scores):
              print("No valid measurements: expected numeric scores in with/without arms.")
              raise SystemExit(1)
          plugins = [p.get("name", "?") for p in data.get("suite", {}).get("plugins", [])]
          print(f"Cost: ${data.get('costUsd', 0):.2f}. Partial: {data.get('partial')}. "
                f"Plugin: {', '.join(plugins) or 'none'}. Ablation: {data.get('suite', {}).get('ablation')}.\n")
          print("| Case | With plugin | Without plugin |")
          print("| --- | ---: | ---: |")
          for case in cases:
              def mean(arm):
                  runs = case.get("arms", {}).get(arm, [])
                  return f"{sum(r.get('score', 0) for r in runs) / len(runs):.2f}" if runs else "-"
              print(f"| {case['name']} | {mean('with')} | {mean('without')} |")
          # A run with no plugin measures the model alone. Fail the job so nobody records it.
          if not plugins:
              print("\n**No plugin loaded. This result measures the model alone; do not record it.**")
              raise SystemExit(1)
          PY
