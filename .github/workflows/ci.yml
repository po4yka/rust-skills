name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded pull request run only. A push to main keeps every run,
  # so each merged commit ends green or red, never cancelled: docs/releasing.md
  # tags only a green main commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: check.sh compares scripts/catalog-ceilings.toml with the
      # merge base of this commit and origin/main, so a raised ceiling fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # npx keeps each pinned CLI in ~/.npm/_npx. checks/check.sh holds every
      # pin, so a pin change also changes the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('checks/check.sh') }}
          restore-keys: npm-${{ runner.os }}-

      # The catalog rules, the unit tests, and the three gates that run a
      # consumer's CLI: skills-CLI discovery and the Claude Code and Codex
      # plugin installs. They need no key and no login. Each CLI version is
      # pinned in checks/check.sh, so a CLI release cannot change the result
      # of a commit that was green yesterday; client-compat.yml and
      # skills-cli-compat.yml run the newest CLIs on a schedule instead.
      # --fast skips cargo; the examples job runs the cargo gates.
      - name: Check the catalog and the client installs
        run: bash checks/check.sh --fast

  examples:
    name: Compile-check examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No toolchain action. checks/rust-toolchain.toml pins the channel and the
      # target, and the runner's rustup installs from it on the first cargo call.
      # That keeps one source of truth for the version a contributor runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            checks/target
          key: checks-${{ runner.os }}-${{ hashFiles('checks/Cargo.lock', 'checks/rust-toolchain.toml') }}
          restore-keys: checks-${{ runner.os }}-

      # Extracts every ```rust block from skills/, type-checks it, and fails on
      # a compile failure the analyzer cannot attribute to an undefined symbol
      # or to the extraction wrapper. The same command a contributor runs,
      # without the client gates: the validate job runs those.
      - name: Run checks
        run: bash checks/check.sh --no-clients
