schema_version: "1.1"
name: ffi-swift-c-abi
description: >-
  The ffi bundle, outcome case. A hand-written C ABI for Swift returns a pointer into a dropped
  CString, unwraps and expects inside extern "C" exports, and dereferences pointers with no null
  check. The rust-swift-ffi skill owns allocator symmetry, explicit errors, and the evidence that
  proves a Swift boundary.
tags: [outcome, ffi, rust-swift-ffi]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: >-
    Our iOS app calls this crate through include/tally.h. Crash reports show two things:
    tally_name sometimes returns garbage text, and sometimes the app just aborts with no Swift
    error at all. Fix the Rust side of the C interface and update the header to match. Tell me
    how you checked the fix.
expected_outcome: >-
  The name crosses the boundary as Rust-owned memory with a matching release export (or into a
  caller buffer), and the header says who frees what. No panic can leave an export: fallible
  paths return an explicit status or error code, and any remaining panic is caught at the
  boundary. Null handles are rejected, and the free export accepts null. The answer says which
  checks it ran and that a Rust unit test does not prove the Swift side.
graders:
  # An indicator, not part of the score: the no-plugin arm cannot load the skill.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?rust-swift-ffi"'
  - name: no-temporary-cstring-pointer
    type: regex
    target: {source: file, path: src/lib.rs}
    pattern: 'CString::new\([^;]*\)\s*\.\s*(?:unwrap|expect)\([^;]*\)\s*\.\s*as_ptr\(\)'
    match: not_contains
  - name: owned-name-with-release
    type: llm
    focus: {source: file, path: src/lib.rs}
    criteria: >-
      PASS if the name no longer points into a value that is dropped when `tally_name` returns,
      in any of these designs: Rust-owned memory handed out (for example `CString::into_raw`, or
      a buffer struct with pointer, length, and capacity) with a separate exported function that
      takes it back and frees it on the Rust side; a copy into a buffer that the caller passes
      in; or a pointer into a `CString` (or bytes) stored in the `Tally` itself, valid until that
      tally is freed.
      FAIL if the returned pointer can still point into a temporary, or if the name is leaked
      with no way to free it.
  - name: header-states-ownership
    type: llm
    focus: {source: file, path: include/tally.h}
    criteria: >-
      PASS if the header no longer presents `tally_name` as returning a plain `const char *`
      with no owner, and its comments say how each fallible function reports a failure and who
      owns each returned pointer or buffer. If the header declares a release function for the
      name, its comment says that the caller must call it exactly once. If the name is copied
      into a caller buffer instead, the comment says how the caller learns the needed size. If
      the name is borrowed from the tally, the comment says that it stays valid only until the
      tally is freed (or the name changes) and that the caller must not free it.
      FAIL if the header still declares the old `tally_name` contract unchanged, says nothing
      about ownership of what Rust returns, or tells Swift to call `free` on memory that Rust
      allocated.
  - name: no-panic-crosses-an-export
    type: llm
    focus: {source: file, path: src/lib.rs}
    criteria: >-
      PASS if no panic can leave an exported function: invalid UTF-8 in `tally_new`, an overflow
      in `tally_add`, and an interior NUL in `tally_name` each produce an explicit failure that
      the caller can see (a status or error code, an error out-parameter, or a documented
      sentinel together with an error code), and every export either has no panicking path or
      wraps its body in `std::panic::catch_unwind`.
      FAIL if an `unwrap`, `expect`, or other reachable panic remains inside an `extern "C"`
      function without a `catch_unwind` around it, or if a failure is reported only by aborting.
  - name: null-handles
    type: llm
    focus: {source: file, path: src/lib.rs}
    criteria: >-
      PASS if every export that takes a `Tally` pointer or a name pointer checks it for null
      before it dereferences it and reports the null as a failure, and `tally_free(NULL)` (or the
      equivalent release function) is a documented no-op.
      FAIL if any export dereferences a pointer argument without a null check.
