items = '''
mod my_crate {
    pub mod wire {
        use std::result::Result;
        pub struct Header;
        #[derive(Debug)]
        pub struct ParseError;
        pub fn parse_header(data: &[u8]) -> Result<Header, ParseError> { todo!() }
    }
}
'''

