# Preludes for the rust-test-tools skill. Format: checks/README.md.

# The crate under test and the reference implementation stand in as crate-root
# modules; a fuzz target reaches them by the same paths. The explicit
# `use std::result::Result;` keeps gen.py from inserting its `Result` alias
# above the block, where it would push `#![no_main]` out of first place.
