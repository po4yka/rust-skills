# Preludes for the rust-type-erasure skill. Format: checks/README.md.

# The trait pair and the store come from references/gat-anymap.md. The section names
# no items for `Extractor`, and the block elides the impl body with `/* ... */`,
# so the stub trait is empty: the prelude checks the impl header and its bound.
[[block]]
file = "rust-type-erasure/SKILL.md"
section = "The helper bound is `for<'x>`, not `'static`"
block = 1
items = '''
trait Owner: 'static { type Element<'a>: Element<'a, Owner = Self>; }
trait Element<'a>: 'a { type Owner: Owner<Element<'a> = Self>; }
trait Extractor {}
struct State<T>(T);
'''
