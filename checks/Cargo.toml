[package]
name = "rust-skills-checks"
version = "0.0.0"
edition = "2024"
publish = false

# Edition 2024: the catalog documents current Rust, so the harness must accept
# 2024 syntax (unsafe extern blocks, let chains, #[unsafe(no_mangle)]).
#
# Harness that compile-checks the ```rust blocks in ../skills/**/*.md.
# Each candidate block becomes examples/<name>.rs and is type-checked with
# `cargo check --examples`. It is a development tool; no skill ships it, and
# `npx skills add` never sees it.
#
# Add a dependency here when a skill starts using a crate in its examples.
# Without it every block that imports the crate degrades to a "fragment" and
# stops being checked at all.

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arrayvec = "0.7"
bytes = "1"
criterion = { version = "0.7", features = ["html_reports"] }
flume = "0.11"
futures = "0.3"
# Harness-only exception. The complete imbl example must reach type checking.
# imbl 7.0.1 pulls bitmaps 3.2.1, which has RUSTSEC-2025-0167 and
# RUSTSEC-2026-0247 with no patched release. The harness never runs this example
# and is not installed with the skills. Remove this pin when imbl drops bitmaps.
imbl = "=7.0.1"
jni = "0.22"
libc = "0.2"
libfuzzer-sys = "0.4"
log = "0.4"
loom = "0.7"
nix = { version = "0.29", features = ["fs", "process", "socket", "uio"] }
once_cell = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
proptest = "1"
rayon = "1"
rpds = "1.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thin-vec = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.29"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.dev]
debug = false
